services:
  - type: web
    name: gstr3b-converter
    runtime: docker
    repo: https://github.com/wolfrec007/gstr3b
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true